spring.application.name=arte-isis-api
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32

spring.flyway.enabled=true

server.port=8080

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

arteisis.upload.dir=data/uploads

arteisis.jwt.expiration-seconds=86400

arteisis.mail.from=
arteisis.mail.contact-to=

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
arteisis.jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
