spring.application.name=arte-isis-api
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32

spring.flyway.enabled=true

server.port=8080

arteisis.jwt.expiration-seconds=86400
# Valor por defeito apenas para desenvolvimento; perfis hml/prod devem definir ARTEISIS_JWT_SECRET.
arteisis.jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
