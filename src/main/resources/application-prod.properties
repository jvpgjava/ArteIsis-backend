spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USER}
spring.datasource.password=${PROD_DB_PASSWORD}

arteisis.cors.allowed-origins=${PROD_CORS_ORIGINS}

server.port=${PROD_SERVER_PORT:4042}

arteisis.jwt.secret=${ARTEISIS_JWT_SECRET}
arteisis.jwt.expiration-seconds=${ARTEISIS_JWT_EXPIRATION_SECONDS:86400}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

arteisis.mail.from=${ARTEISIS_MAIL_FROM:}
arteisis.mail.contact-to=${ARTEISIS_MAIL_CONTACT_TO:}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
