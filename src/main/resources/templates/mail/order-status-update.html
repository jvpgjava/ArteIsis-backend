<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atualização do seu pedido — Arte Isis</title>
</head>
<body style="margin:0;padding:0;background-color:#e8eef3;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:linear-gradient(180deg,#dce6ee 0%,#e8eef3 48%,#f4f7fa 100%);padding:32px 16px 40px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:580px;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(59,107,138,0.12);border:1px solid #d4dee6;">

          <!-- Cabeçalho -->
          <tr>
            <td style="background:linear-gradient(145deg,#0d1117 0%,#1a2332 50%,#152238 100%);padding:28px 24px;text-align:center;border-bottom:3px solid #db7077;">
              <img th:if="${hasLogo}" src="cid:arteisisLogo" width="220" alt="Arte Isis" style="display:block;margin:0 auto;max-width:220px;height:auto;border:0;"/>
              <div th:unless="${hasLogo}" style="font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;letter-spacing:0.12em;color:#cbd5e1;">
                <span style="color:#7eb8d4;">ARTE</span> <span style="color:#db7077;">ISIS</span>
              </div>
            </td>
          </tr>

          <!-- Mensagem -->
          <tr>
            <td style="padding:32px 36px 0;background-color:#ffffff;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2a2a2a;">
              <p style="margin:0 0 6px;font-size:20px;font-weight:700;color:#1a2332;">Seu pedido foi atualizado!</p>
              <p style="margin:0 0 28px;font-size:14px;color:#64748b;line-height:1.6;">
                Olá, <strong th:text="${customerName}">Cliente</strong>!
                O status do seu pedido foi alterado pela nossa equipe.
              </p>
            </td>
          </tr>

          <!-- Novo status em destaque -->
          <tr>
            <td style="padding:0 36px 24px;background-color:#ffffff;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1a2332 0%,#243447 100%);">
                <tr>
                  <td style="padding:22px 24px;">
                    <p style="margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#64748b;">Novo status</p>
                    <p style="margin:0;font-size:22px;font-weight:700;" th:style="|color:${statusColor};font-size:22px;font-weight:700;margin:0;|" th:text="${statusLabel}">—</p>
                    <p style="margin:6px 0 0;font-size:12px;color:#64748b;" th:text="${statusDescription}">—</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Dados do pedido -->
          <tr>
            <td style="padding:0 36px 28px;background-color:#ffffff;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-radius:14px;overflow:hidden;border:1px solid #e2e8f0;">
                <tr>
                  <td colspan="2" style="background:linear-gradient(90deg,#3b6b8a 0%,#4a7a9a 100%);padding:12px 18px;font-size:13px;font-weight:700;letter-spacing:0.04em;color:#ffffff;">Detalhes do pedido</td>
                </tr>
                <tr>
                  <td style="padding:12px 16px;border-bottom:1px solid #f1f5f9;color:#64748b;font-size:13px;width:130px;">Número</td>
                  <td style="padding:12px 16px;border-bottom:1px solid #f1f5f9;font-size:13px;font-weight:600;color:#1e293b;font-family:monospace;" th:text="${orderId}">—</td>
                </tr>
                <tr>
                  <td style="padding:12px 16px;border-bottom:1px solid #f1f5f9;color:#64748b;font-size:13px;">Data do pedido</td>
                  <td style="padding:12px 16px;border-bottom:1px solid #f1f5f9;font-size:13px;font-weight:600;color:#1e293b;" th:text="${orderDate}">—</td>
                </tr>
                <tr>
                  <td style="padding:12px 16px;color:#64748b;font-size:13px;">Produtos</td>
                  <td style="padding:12px 16px;font-size:13px;color:#334155;" th:text="${productSummary}">—</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Rodapé -->
          <tr>
            <td style="padding:20px 36px 28px;background-color:#ffffff;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-top:1px solid #f1f5f9;">
              <p style="margin:0;font-size:12px;color:#94a3b8;line-height:1.6;text-align:center;">
                Dúvidas? Responda este e-mail ou entre em contato conosco pelo Instagram.<br/>
                <strong style="color:#3b6b8a;">Arte Isis Serigrafia</strong>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
